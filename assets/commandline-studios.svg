<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Importing the exact geometric sans-serif font for perfect rendering -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&amp;display=swap');
      
      .icon-element {
        stroke: #2ad5b0; /* The exact vibrant mint/teal color */
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      
      .text-bold {
        font-family: 'Poppins', -apple-system, sans-serif;
        font-weight: 700;
        fill: #ffffff;
        font-size: 76px;
        letter-spacing: -0.02em;
      }
      
      .text-light {
        font-family: 'Poppins', -apple-system, sans-serif;
        font-weight: 300;
        fill: #ffffff;
        font-size: 47px;
        letter-spacing: 0.39em; /* Exact tracked-out spacing for 'studios' */
      }
    </style>
  </defs>

  <!-- Transparent background (no background rectangle) -->

  <!-- Logo Wrapper Group (Perfected optical centering at Y=390) -->
  <g transform="translate(255, 390)">
    
    <!-- Terminal Icon Unit -->
    <g transform="translate(0, -32)">
      <!-- Chevron '>' -->
      <path class="icon-element" d="M 0,0 L 32,32 L 0,64" />
      <!-- Underscore '_' -->
      <line class="icon-element" x1="42" y1="64" x2="72" y2="64" />
    </g>
    
    <!-- Typography Unit -->
    <g transform="translate(135, 0)">
      <text x="0" y="0" class="text-bold">commandline</text>
      <text x="3" y="52" class="text-light">studios</text>
    </g>
    
  </g>
</svg>